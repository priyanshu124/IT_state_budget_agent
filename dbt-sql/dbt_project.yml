name: 'mbtsa'
version: '1.0.0'
config-version: 2

profile: 'mbtsa'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  dbt_metrics_calendar_model: custom_metrics_calendar

models:
  mbtsa:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
  metrics:
    dbt_metrics_default_calendar:
      +enabled: false
