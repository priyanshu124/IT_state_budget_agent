version: 2

models:
  - name: fct_agency_level
    description: "Agency-level budget aggregation for dashboard reporting"
    columns:
      - name: agency_level_id
        data_tests:
          - unique
          - not_null
      - name: fiscal_year
        data_tests:
          - not_null
      - name: fund_type
        data_tests:
          - not_null
      - name: agency_code
        data_tests:
          - not_null
      - name: agency_name
        data_tests:
          - not_null
      - name: total_budget_amount
        data_tests:
          - not_null
      - name: it_budget_amount
        data_tests:
          - not_null
      - name: non_it_budget_amount
        data_tests:
          - not_null

  - name: fct_it_spend
    description: "Fact table: all budget line items with TBM classifications"
    columns:
      - name: spend_id
        description: "Surrogate key"
        data_tests:
          - unique
          - not_null
      - name: fiscal_year
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: description
        description: "Narrative description from the source budget line item"
      - name: cost_pool
        data_tests:
          - not_null
      - name: is_it
        data_tests:
          - not_null

  - name: fct_budget_anomalies
    description: "Precomputed anomalies for selectable hierarchy levels"
    columns:
      - name: anomaly_id
        data_tests:
          - unique
          - not_null
      - name: anomaly_level
        data_tests:
          - not_null
      - name: entity
        data_tests:
          - not_null
      - name: fiscal_year
        data_tests:
          - not_null
      - name: spend
        data_tests:
          - not_null
      - name: avg_spend
        data_tests:
          - not_null

  - name: fct_budget_anomalies_deep
    description: "Precomputed anomalies at full hierarchy + fund for deep drill-down"
    columns:
      - name: deep_anomaly_id
        data_tests:
          - unique
          - not_null
      - name: fiscal_year
        data_tests:
          - not_null
      - name: spend
        data_tests:
          - not_null
      - name: avg_spend
        data_tests:
          - not_null

  - name: dim_agency
    description: "Agency dimension"
    columns:
      - name: agency_code
        data_tests:
          - unique
          - not_null

  - name: dim_program
    description: "Program/subprogram dimension"
    columns:
      - name: organization_code
        data_tests:
          - unique
          - not_null
      - name: description
        description: "Program description aggregated from source budget rows"
